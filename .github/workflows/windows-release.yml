name: Windows Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "供应商表格整合工具" main.py
      - run: pyinstaller --noconfirm --clean --onefile --name "supplier-merger-cli" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-merger-windows
          path: |
            dist/供应商表格整合工具.exe
            dist/supplier-merger-cli.exe
